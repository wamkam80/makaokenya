<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mako Kenya - Real Estate</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

  <!-- Navigation Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between z-10">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-house-chimney text-blue-600 text-2xl"></i>
      <span class="text-xl font-bold text-gray-800">TrueHome <span class="text-blue-600">Kenya</span></span>
    </div>
    <div class="flex items-center space-x-4">
      <button class="px-4 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition">List Property</button>
      <button class="px-4 py-2 text-gray-600 font-medium hover:text-gray-800">Sign In</button>
    </div>
  </header>

  <!-- Search and Filter Bar -->
  <div class="bg-white border-b border-gray-200 px-6 py-3 shadow-sm z-10">
    <div class="flex flex-wrap items-center gap-3">
      <!-- Location Search Input -->
      <div class="flex items-center flex-1 min-w-[240px] border border-gray-300 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-blue-500">
        <input type="text" placeholder="Location (e.g. Kilimani, Westlands, Kileleshwa, Karen, Ruaka)..." class="w-full px-3 py-2 text-sm outline-none text-gray-700" />
        <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 text-sm font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-magnifying-glass"></i> Search
        </button>
      </div>

      <!-- Listing Type Dropdown -->
      <select class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="rent">For Rent</option>
        <option value="sale">For Sale</option>
      </select>

      <!-- Price Range -->
      <div class="flex items-center gap-1 border border-gray-300 rounded-lg px-2 py-1 bg-white">
        <input type="number" placeholder="Min KSh" class="w-24 px-1 py-1 text-sm outline-none text-gray-700" />
        <span class="text-gray-400 text-sm">-</span>
        <input type="number" placeholder="Max KSh" class="w-24 px-1 py-1 text-sm outline-none text-gray-700" />
      </div>

      <!-- Bedrooms -->
      <select class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">Bedrooms</option>
        <option value="studio">Bedsitter/Studio</option>
        <option value="1">1 Bed</option>
        <option value="2">2 Beds</option>
        <option value="3">3 Beds</option>
        <option value="4+">4+ Beds</option>
      </select>

      <!-- Kenya-specific Amenities / Must-Haves -->
      <select class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">Must-Haves / Amenities</option>
        <option value="water">Borehole/Reliable Water</option>
        <option value="generator">Backup Generator</option>
        <option value="dsq">DSQ (Domestic Servant Quarters)</option>
        <option value="fence">Perimeter Electric Fence</option>
        <option value="cabro">Cabro Paving</option>
        <option value="internet">High-speed Internet</option>
      </select>
    </div>
  </div>

  <!-- Main Content Layout -->
  <div class="flex-1 flex flex-col md:flex-row-reverse overflow-hidden">
    <!-- Listings Column -->
    <div class="w-full md:w-1/2 overflow-y-auto p-4 space-y-4 bg-gray-50">
      <!-- Property Card 1 -->
      <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition border border-gray-200">
        <div class="md:flex">
          <div class="md:w-1/3">
            <img class="h-48 w-full object-cover md:h-full" src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=600&q=80" alt="Apartment in Kilimani">
          </div>
          <div class="p-4 md:w-2/3 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start">
                <span class="text-xs font-semibold uppercase tracking-wider text-blue-600 bg-blue-50 px-2 py-1 rounded">For Rent</span>
                <span class="text-lg font-bold text-gray-900">KSh 85,000 / mo</span>
              </div>
              <h2 class="text-md font-bold text-gray-800 mt-1">Modern 2 Bedroom Apartment</h2>
              <p class="text-sm text-gray-500">Kilimani, Nairobi</p>
              <div class="mt-2 flex items-center space-x-4 text-xs text-gray-600">
                <span><i class="fa-solid fa-bed text-blue-500"></i> 2 Beds</span>
                <span><i class="fa-solid fa-bath text-blue-500"></i> 2 Baths</span>
                <span><i class="fa-solid fa-house-user text-blue-500"></i> DSQ</span>
                <span><i class="fa-solid fa-faucet-drip text-blue-500"></i> Borehole</span>
              </div>
            </div>
            <div class="mt-3 flex space-x-2">
              <button class="flex-1 bg-blue-600 text-white text-xs py-2 rounded hover:bg-blue-700 transition font-medium">Contact Agent</button>
              <button class="px-3 py-2 border border-gray-300 text-gray-600 text-xs rounded hover:bg-gray-100 transition"><i class="fa-regular fa-heart"></i></button>
            </div>
          </div>
        </div>
      </div>

      <!-- Property Card 2 -->
      <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition border border-gray-200">
        <div class="md:flex">
          <div class="md:w-1/3">
            <img class="h-48 w-full object-cover md:h-full" src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=600&q=80" alt="Villa in Karen">
          </div>
          <div class="p-4 md:w-2/3 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start">
                <span class="text-xs font-semibold uppercase tracking-wider text-green-600 bg-green-50 px-2 py-1 rounded">For Sale</span>
                <span class="text-lg font-bold text-gray-900">KSh 65,000,000</span>
              </div>
              <h2 class="text-md font-bold text-gray-800 mt-1">Luxury 4 Bedroom Villa</h2>
              <p class="text-sm text-gray-500">Karen, Nairobi</p>
              <div class="mt-2 flex items-center space-x-4 text-xs text-gray-600">
                <span><i class="fa-solid fa-bed text-blue-500"></i> 4 Beds</span>
                <span><i class="fa-solid fa-bath text-blue-500"></i> 5 Baths</span>
                <span><i class="fa-solid fa-bolt text-blue-500"></i> Generator</span>
                <span><i class="fa-solid fa-shield-halved text-blue-500"></i> Electric Fence</span>
              </div>
            </div>
            <div class="mt-3 flex space-x-2">
              <button class="flex-1 bg-blue-600 text-white text-xs py-2 rounded hover:bg-blue-700 transition font-medium">Contact Agent</button>
              <button class="px-3 py-2 border border-gray-300 text-gray-600 text-xs rounded hover:bg-gray-100 transition"><i class="fa-regular fa-heart"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Map Column -->
    <div class="w-full md:w-1/2 h-64 md:h-auto relative z-0">
      <div id="map" class="h-full w-full"></div>
    </div>
  </div>

  <script>
    const map = L.map('map').setView([-1.286389, 36.817223], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    L.marker([-1.2921, 36.7821]).addTo(map).bindPopup('<b>Kilimani Apartment</b><br>KSh 85,000 / mo');
    L.marker([-1.3197, 36.7062]).addTo(map).bindPopup('<b>Karen Villa</b><br>KSh 65,000,000');
  </script>
</body>
</html>
