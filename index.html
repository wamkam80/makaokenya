<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakaoKenya - Verified Rentals & Direct Caretakers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 400px; width: 100%; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 py-6 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-blue-600">MakaoKenya</h1>
            <nav class="space-x-4">
                <a href="#properties" class="text-gray-600 hover:text-blue-600">Properties</a>
                <a href="#map-section" class="text-gray-600 hover:text-blue-600">Map</a>
            </nav>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 py-8">
        <section id="map-section" class="mb-12">
            <h2 class="text-2xl font-bold mb-4">Interactive Property Map</h2>
            <div id="map"></div>
        </section>
        <section id="properties" class="mb-12">
            <h2 class="text-2xl font-bold mb-6">Featured Rentals</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="relative">
                        <img id="carousel-1" src="https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=600" alt="Apartment 1" class="w-full h-48 object-cover">
                        <button onclick="prevImage(1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 text-white p-2 rounded-full"><i class="fas fa-chevron-left"></i></button>
                        <button onclick="nextImage(1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 text-white p-2 rounded-full"><i class="fas fa-chevron-right"></i></button>
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-lg">Luxury 2 Bedroom Apartment</h3>
                        <p class="text-gray-600">Nairobi, Kilimani</p>
                        <p class="text-blue-600 font-bold mt-2">KSh 45,000 / month</p>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="relative">
                        <img id="carousel-2" src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=600" alt="Apartment 2" class="w-full h-48 object-cover">
                        <button onclick="prevImage(2)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 text-white p-2 rounded-full"><i class="fas fa-chevron-left"></i></button>
                        <button onclick="nextImage(2)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 text-white p-2 rounded-full"><i class="fas fa-chevron-right"></i></button>
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-lg">Modern Studio Apartment</h3>
                        <p class="text-gray-600">Nairobi, Westlands</p>
                        <p class="text-blue-600 font-bold mt-2">KSh 30,000 / month</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script>
        const map = L.map('map').setView([-1.286389, 36.817223], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
        L.marker([-1.286389, 36.817223]).addTo(map).bindPopup('Luxury 2 Bedroom - Kilimani');
        L.marker([-1.2675, 36.8120]).addTo(map).bindPopup('Modern Studio - Westlands');
        const images = {
            1: ['https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=600', 'https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=600'],
            2: ['https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=600', 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600']
        };
        const indices = { 1: 0, 2: 0 };
        function updateCarousel(id) { document.getElementById(`carousel-${id}`).src = images[id][indices[id]]; }
        function nextImage(id) { indices[id] = (indices[id] + 1) % images[id].length; updateCarousel(id); }
        function prevImage(id) { indices[id] = (indices[id] - 1 + images[id].length) % images[id].length; updateCarousel(id); }
    </script>
</body>
</html>
