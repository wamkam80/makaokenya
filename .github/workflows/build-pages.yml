# Rebuilds the pages Google reads (one page per listing, area and type pages,
# guides and sitemap.xml) from the live listings, every day and whenever the
# generator changes. Commits the result so GitHub Pages publishes it.
name: Build search pages

on:
  schedule:
    - cron: '23 2 * * *'     # every day, 02:23 UTC (05:23 Nairobi)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'index.html', '.github/workflows/build-pages.yml']

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build pages from live listings
        run: node scripts/build-seo.mjs
      - name: Commit changes
        run: |
          git config user.name "TrueHome bot"
          git config user.email "actions@users.noreply.github.com"
          for p in homes rent buy guides sitemap.xml; do
            if [ -e "$p" ] || git ls-files --error-unmatch "$p" >/dev/null 2>&1; then git add -A -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update search pages ($(date -u +%Y-%m-%d))"
            git push
          fi
